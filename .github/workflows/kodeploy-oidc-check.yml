name: kodeploy-oidc-check
on:
  workflow_dispatch:
    inputs:
      expect:
        description: "deploy = 교환 → 재배포 → 같은 ID 토큰 재교환 401 / 403 = 교환이 403이어야 함"
        default: deploy
permissions:
  id-token: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: exchange and redeploy
        env:
          APP_ID: ddb4bd25-e0e9-48b8-8b3d-6c124e2923a8
          API: https://api.kodeploy.com
          EXPECT: ${{ inputs.expect }}
        run: |
          set -eu
          ID_TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=kodeploy" | jq -r .value)
          if [ "$EXPECT" = "403" ]; then
            code=$(curl -s -o exchange.json -w '%{http_code}' -X POST "$API/apps/$APP_ID/ci/token" \
              -H 'Content-Type: application/json' -d "{\"id_token\":\"$ID_TOKEN\"}")
            echo "exchange http=$code body=$(jq -c '{detail, code}' exchange.json)"
            test "$code" = 403
            exit 0
          fi
          TOKEN=$(curl -fsS -X POST "$API/apps/$APP_ID/ci/token" \
            -H 'Content-Type: application/json' -d "{\"id_token\":\"$ID_TOKEN\"}" | jq -r .token)
          curl -fsS -X POST "$API/apps/$APP_ID/deploy/redeploy" \
            -H "Authorization: Bearer $TOKEN" -H "Idempotency-Key: gha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            -H 'Content-Type: application/json' -d '{}' | tee redeploy.json
          echo
          echo "GITHUB_SHA=$GITHUB_SHA requested_sha=$(jq -r .requested_sha redeploy.json)"
          test "$(jq -r .requested_sha redeploy.json)" = "$GITHUB_SHA"
          # 두 번째 교환은 같은 jti라 401이어야 한다
          code=$(curl -s -o second.json -w '%{http_code}' -X POST "$API/apps/$APP_ID/ci/token" \
            -H 'Content-Type: application/json' -d "{\"id_token\":\"$ID_TOKEN\"}")
          echo "second exchange http=$code body=$(jq -c '{detail, code}' second.json)"
          test "$code" = 401
