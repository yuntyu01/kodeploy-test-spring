name: other-deploy

# 앱에 지정하지 않은 워크플로에서 배포를 부르면 교환이 거절되는지 보는 시험용 (확인 뒤 지운다)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: kodeploy/deploy-action@678ee39b122c1242a5b12a22c1431a187205fd49 # v1.0.0
        with:
          app: ${{ vars.KODEPLOY_APP_ID }}
