name: kodeploy-cli-check
on:
  workflow_dispatch:
    inputs:
      args:
        description: "kodeploy deploy에 더할 인자 (예: --timeout 20s)"
        default: ""
      expect:
        description: "기대 exit code"
        default: "0"
permissions: { id-token: write, contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: go install github.com/kodeploy/kodeploy/cli/cmd/kodeploy@fdbb317788f30a628d6cacb810275a0374d95609
      - name: kodeploy deploy
        env:
          ARGS: ${{ inputs.args }}
          EXPECT: ${{ inputs.expect }}
        run: |
          set +e
          kodeploy deploy --app ddb4bd25-e0e9-48b8-8b3d-6c124e2923a8 $ARGS
          code=$?
          echo "kodeploy exit=$code (expect $EXPECT)"
          echo "--- step summary"
          cat "$GITHUB_STEP_SUMMARY"
          test "$code" = "$EXPECT"
